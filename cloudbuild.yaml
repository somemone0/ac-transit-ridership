# Build and deploy to Cloud Run.
#
# NEXT_PUBLIC_* values are inlined into the client bundle by `next build`, so
# they have to be build args, not runtime env vars. The CARTO key is passed in
# as a substitution rather than committed: it is visible to anyone who opens
# the deployed site (every NEXT_PUBLIC_ value is), but a public repo would let
# it be lifted against this account's quota without ever visiting the app.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_CARTO_KEY=<key>
#
# Omitting _CARTO_KEY is supported and falls back to OpenStreetMap tiles.
substitutions:
  _SERVICE: ac-transit-ridership
  _REGION: us-west1
  _PACK_BASE: https://storage.googleapis.com/ac-transit-ridership-pack/pack
  _CARTO_KEY: ""
  # SHORT_SHA is only set for trigger-based builds; a manual submit passes this.
  _TAG: manual

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_PACK_BASE=${_PACK_BASE}
      - --build-arg=NEXT_PUBLIC_CARTO_KEY=${_CARTO_KEY}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:${_TAG}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:${_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
